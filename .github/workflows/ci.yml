name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend tests (with seeded Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus_connect_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_connect_ci
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync database schema
        # `db push` applies the Prisma schema directly — deliberate: the
        # migration history contains manually-resolved entries that don't
        # replay on a fresh database. Once migrations are squashed this can
        # become `prisma migrate deploy`.
        run: npx prisma db push --skip-generate

      - name: Seed database
        run: npx prisma db seed

      - name: Run tests
        # Includes the authenticated route smoke suites — with the seeded DB
        # available they exercise every GET route per role, which is exactly
        # the net that catches schema/code drift before it ships.
        run: npm test

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Production builds fail fast without this (see src/lib/api-config.ts).
      NEXT_PUBLIC_API_URL: https://ci-placeholder.invalid/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
