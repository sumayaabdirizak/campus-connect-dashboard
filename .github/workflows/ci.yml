name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Frontend: install, lint, typecheck (Sprint 0 "build" gate)
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # Backend: Postgres, Prisma pipeline, migration deploy, /health smoke
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: campus_connect_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d campus_connect_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/campus_connect_ci?schema=public
      JWT_SECRET: ci-jwt-secret-not-for-production-use-only
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run prisma:migrate:deploy
      - run: npm run db:status
      - run: npm run prisma:seed
      # Sprint 2: Vitest (RBAC, JWT, pagination, standardized errors) — must pass on PRs
      - run: npm test
      - name: Health smoke
        run: |
          node src/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4000/health" >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          test -s /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
