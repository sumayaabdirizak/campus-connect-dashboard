  </g>

  <!-- Small stat dots trailing the arrow -->
  <circle cx="146" cy="120" r="4" fill="#10B981" stroke="#1F2937" stroke-width="2"/>
  <circle cx="158" cy="108" r="4" fill="#10B981" stroke="#1F2937" stroke-width="2"/>
