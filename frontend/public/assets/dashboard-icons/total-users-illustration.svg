<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Back person (purple) -->
  <g stroke="#1F2937" stroke-width="3" stroke-linejoin="round">
    <circle cx="60" cy="70" r="20" fill="#C4B5FD"/>
    <path d="M28 148c0-24 14-40 32-40s32 16 32 40v6H28v-6z" fill="#8B5CF6"/>
  </g>

  <!-- Front person (blue) -->
  <g stroke="#1F2937" stroke-width="3" stroke-linejoin="round">
    <circle cx="108" cy="76" r="24" fill="#93C5FD"/>
    <path d="M68 168c0-28 18-46 40-46s40 18 40 46v6H68v-6z" fill="#3B82F6"/>
  </g>

  <!-- Upward growth arrow (green) -->
  <g stroke="#1F2937" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="140,110 160,88 178,100" fill="none"/>
